# Portfolio 网站 Nginx 配置
# 将此配置添加到 /etc/nginx/sites-available/ 或 /etc/nginx/conf.d/

server {
    listen 80;
    server_name 36.151.143.238 _;  # 改成你的域名或 IP

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    location = /love {
        try_files /jianli/index.html =404;
    }

    location = /love/ {
        return 301 /love;
    }

    location = /jianli/love {
        return 301 /love;
    }

    location = /jianli/love/ {
        return 301 /love;
    }

    location = /jianli {
        return 301 /jianli/;
    }

    # API 反向代理到 Node.js 后端
    location = /jianli/api {
        proxy_pass http://127.0.0.1:3001/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /jianli/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # 上传文件目录
    location = /jianli/uploads {
        proxy_pass http://127.0.0.1:3001/uploads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /jianli/uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 管理后台
    location = /jianli/admin {
        proxy_pass http://127.0.0.1:3001/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA 路由支持
    location /jianli/ {
        try_files $uri $uri/ /jianli/index.html;
    }

    location / {
        return 404;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
